# Render blueprint: one Node web service. The database is not created here:
# point DATABASE_URL at a durable Postgres (a paid Render database, or a new
# database inside one you already pay for). Render's free Postgres is deleted
# after 30 days, so it must not hold real students.
services:
  - type: web
    name: unisprint-apply
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CONTACT_TELEGRAM
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: CONTACT_INSTAGRAM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
