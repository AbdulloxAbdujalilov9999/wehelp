<title>WeHelp</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: a travel-document system — ticket-stub cards track each
   application like a boarding pass, a passport-style stamp badge carries
   country + status everywhere, and a dense table powers the explorer. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EBEEF4;
  --ink:#121B30; --muted:#5B657C; --faint:#8A93A8;
  --line:#D7DCE6; --accent:#C8791F; --accent-ink:#5C3410; --accent-soft:#F6E4C9;
  --good:#1F7A4D; --good-soft:#DCF0E3; --warn:#B4600F; --warn-soft:#FBE7CE;
  --bad:#9C3B3B; --bad-soft:#F6DEDE; --info:#2A5CAA; --info-soft:#DCE6F8;
  --shadow:0 1px 2px rgba(18,27,48,.06), 0 8px 24px -12px rgba(18,27,48,.16);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --surface:#161C2E; --surface-2:#1E2538;
    --ink:#EDEFF5; --muted:#A9AFC2; --faint:#767E93;
    --line:#2B3349; --accent:#E3A33E; --accent-ink:#2B1A08; --accent-soft:#3A2A13;
    --good:#4EBE84; --good-soft:#163428; --warn:#E3A33E; --warn-soft:#3A2A13;
    --bad:#E08080; --bad-soft:#3A1F1F; --info:#7FA8E8; --info-soft:#19263F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161C2E; --surface-2:#1E2538;
  --ink:#EDEFF5; --muted:#A9AFC2; --faint:#767E93;
  --line:#2B3349; --accent:#E3A33E; --accent-ink:#2B1A08; --accent-soft:#3A2A13;
  --good:#4EBE84; --good-soft:#163428; --warn:#E3A33E; --warn-soft:#3A2A13;
  --bad:#E08080; --bad-soft:#3A1F1F; --info:#7FA8E8; --info-soft:#19263F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:40px}
h1,h2,h3,.disp{font-family:"Fraunces",Georgia,serif;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px}
.hide{display:none!important}

/* ---------- Sidebar nav ---------- */
:root{ --sidebar-w:244px }
.sidebar-toggle-float{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:70;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-size:16px;display:none;align-items:center;justify-content:center}
body:not(.sidebar-open) .sidebar-toggle-float{display:flex}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:55}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.sidebar-open .sidebar{transform:translateX(0)}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 14px}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;border:none;background:none;padding:0;color:var(--ink)}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-family:"Fraunces",serif;font-weight:700;font-size:16px;flex:none}
.brand .word{font-family:"Fraunces",serif;font-weight:600;font-size:19px}
.sidebar-toggle-inline{background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.sidebar-nav button{display:flex;align-items:center;text-align:left;background:none;border:none;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;width:100%}
.sidebar-nav button:hover{background:var(--surface-2);color:var(--ink)}
.sidebar-nav button.active{background:var(--accent-soft);color:var(--accent-ink)}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:14px}
.sidebar-user{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;width:100%}
.sidebar-user:hover{border-color:var(--accent)}
.sidebar-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:700;font-size:13px;flex:none}
.sidebar-user-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.sidebar-user-text b{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-text span{font-size:11px;color:var(--muted)}
.plan-badge{flex:none;font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.plan-badge.paid{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.nav-count{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 10px;cursor:pointer;font-weight:600;width:100%}
.nav-count b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.main-area{padding-top:calc(60px + env(safe-area-inset-top,0px))}
@media (min-width:760px){
  body.sidebar-open .main-area{margin-left:var(--sidebar-w)}
  .sidebar-backdrop{display:none!important}
}
@media (max-width:759px){
  .sidebar{width:min(var(--sidebar-w),85vw)}
  body.sidebar-open .sidebar-backdrop{display:block}
}

/* ---------- Generic blocks ---------- */
.section{padding-block:40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid transparent;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.01em}
.stamp{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);text-transform:uppercase}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--faint)}
.divider{height:1px;background:var(--line);margin-block:20px}
.copybtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--ink);font-family:"IBM Plex Mono",monospace}

/* ---------- Home ---------- */
.hero{padding-block:52px 36px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(32px,5vw,48px);font-weight:600;margin:0 0 14px;line-height:1.05}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p.lede{font-size:16.5px;color:var(--muted);max-width:46ch;margin:0 0 22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.todo-card{padding:20px}
.todo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.todo-list button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:none;border-top:1px solid var(--line);padding:11px 2px;text-align:left;cursor:pointer;color:var(--ink);font-size:13.5px;font-weight:600}
.todo-list li:first-child button{border-top:none}
.todo-list button:hover span:first-child{color:var(--accent)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media (max-width:760px){.dash-grid{grid-template-columns:1fr}}
.deadline-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.deadline-row:first-of-type{border-top:none}
.feed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.feed-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
.feed-list li:first-child{border-top:none}
.quick-links{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media (max-width:620px){.quick-links{grid-template-columns:1fr 1fr}}
.quick-link{padding:16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;border:1px solid var(--line)}
.quick-link:hover{border-color:var(--accent)}
.quick-link b{font-size:13.5px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
@media (max-width:620px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 14px}
.stat .n{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.steps{grid-template-columns:1fr}}
.step{padding:18px}
.step .k{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-weight:600;font-size:13px}
.step h3{font-size:15.5px;margin:8px 0 6px}
.step p{margin:0;font-size:13px;color:var(--muted)}
.advisor{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;padding:26px}
@media (max-width:760px){.advisor{grid-template-columns:1fr}}
.contact-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.contact-chip span{font-family:"IBM Plex Mono",monospace;font-size:13px}

/* ---------- Explore ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:16px;margin-bottom:18px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme="dark"] .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}}
.uni-card{display:flex;flex-direction:column;gap:10px;padding:18px;cursor:pointer}
.uni-card:hover{border-color:var(--accent)}
.uni-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.uni-name{font-family:"Fraunces",serif;font-size:17px;font-weight:600;line-height:1.2}
.uni-loc{font-size:12.5px;color:var(--muted);margin-top:3px}
.uni-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.uni-stats b{display:block;color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.uni-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.star-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--faint);flex:none}
.star-btn.on{color:var(--accent);border-color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- University detail ---------- */
.detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:none;padding:10px 4px;margin-right:18px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--ink);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:560px){.kv{grid-template-columns:1fr}}
.kv-item{padding:14px;background:var(--surface-2);border-radius:10px}
.kv-item .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.kv-item .v{font-family:"IBM Plex Mono",monospace;font-size:15px;margin-top:4px;font-weight:600}
.fact-box{margin-top:16px;padding:14px 16px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px}
.fact-k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;opacity:.75}
.official-link{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--ink);text-decoration:none}
.official-link:hover{border-color:var(--accent)}
.official-link span{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:12px;color:var(--muted)}
.taglist{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px}

/* ---------- Compare ---------- */
.cmp-table{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp-table th,.cmp-table td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.cmp-table th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.cmp-table td.k{color:var(--muted);font-weight:600;white-space:nowrap}
.cmp-table .mono-cell{font-family:"IBM Plex Mono",monospace}
.cmp-scroll{overflow-x:auto}
.cmp-pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cmp-slot{border:1px dashed var(--line);border-radius:10px;padding:12px;min-width:160px;flex:1;font-size:13px;color:var(--muted);text-align:center}

/* ---------- Profile ---------- */
.progress-ring{width:66px;height:66px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface-2) 0)}
.progress-ring .hole{width:50px;height:50px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.profile-head{display:flex;gap:16px;align-items:center;padding:18px;margin-bottom:20px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.doc-row.done{border-color:var(--good)}
.doc-info{display:flex;align-items:center;gap:10px}
.doc-dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.doc-dot.on{background:var(--good)}
.doc-name{font-size:12px;color:var(--faint)}
.file-btn{position:relative;overflow:hidden}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.activity-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.activity-top{display:flex;align-items:center;gap:10px}
.add-row{border:1px dashed var(--line);border-radius:10px;padding:14px;margin-top:14px;background:var(--surface-2)}
.save-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;z-index:200}
.save-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Applications / ticket stubs ---------- */
.stub{display:grid;grid-template-columns:1fr auto;align-items:stretch;overflow:hidden;position:relative;margin-bottom:16px}
.stub-main{padding:18px 18px 16px}
.stub-side{width:140px;background:var(--surface-2);border-left:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;position:relative}
.stub::before,.stub::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bg);right:122px;z-index:2}
.stub::before{top:-9px}
.stub::after{bottom:-9px}
@media (max-width:560px){.stub{grid-template-columns:1fr}.stub-side{width:auto;border-left:none;border-top:1px dashed var(--line);flex-direction:row;justify-content:space-between}.stub::before,.stub::after{display:none}}
.stub-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stub-name{font-family:"Fraunces",serif;font-size:17px;font-weight:600}
.timeline{display:flex;gap:4px;margin-top:12px}
.tl-seg{flex:1;height:5px;border-radius:3px;background:var(--line)}
.tl-seg.on{background:var(--accent)}
.tl-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media (max-width:620px){.dash-stats{grid-template-columns:repeat(2,1fr)}}
.bar-track{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.checklist-mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ck-chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.ck-chip.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.demo-control{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demo-control label{font-size:11px;color:var(--faint);font-weight:600}
.demo-control select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted)}

/* ---------- Apply flow ---------- */
.stepper{display:flex;gap:6px;margin-bottom:24px}
.stepper .seg{flex:1;height:4px;background:var(--line);border-radius:3px}
.stepper .seg.done{background:var(--good)}
.stepper .seg.cur{background:var(--accent)}
.step-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:none}
.check-mark{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.check-mark.ok{background:var(--good);border-color:var(--good);color:#fff}
.check-mark.bad{border-color:var(--warn)}

/* ---------- Resources ---------- */
.res-card{padding:18px;display:flex;flex-direction:column;gap:8px}
.res-tag{align-self:flex-start}

/* ---------- Pricing / gating ---------- */
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
@media (max-width:820px){.pricing-grid{grid-template-columns:1fr}}
.plan-card{padding:22px;display:flex;flex-direction:column;gap:14px;position:relative}
.plan-card.featured{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow)}
.plan-ribbon{position:absolute;top:-11px;right:18px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px}
.plan-price{display:flex;align-items:baseline;gap:4px}
.plan-price .amt{font-family:"Fraunces",serif;font-size:34px;font-weight:600}
.plan-price .note{color:var(--muted);font-size:13px}
.plan-feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;flex:1}
.plan-feats li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.plan-feats li::before{content:"✓";color:var(--good);font-weight:700;flex:none}
.gate-card{padding:22px;text-align:center;border:1px dashed var(--accent);background:var(--accent-soft)}
.gate-card h3{margin:0 0 6px;font-size:16px;color:var(--accent-ink)}
.gate-card p{margin:0 0 14px;color:var(--accent-ink);opacity:.85;font-size:13.5px}
.locked-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:13px;color:var(--faint)}

footer.site{padding:30px 0 10px;text-align:center}
footer.site p{font-size:12px;color:var(--faint);max-width:520px;margin:0 auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uniById(id){ for(var i=0;i<UNIS.length;i++){ if(UNIS[i].id===id) return UNIS[i]; } return null; }
function fmtUSD(n){ return n===0 ? "$0" : "$"+n.toLocaleString("en-US"); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function daysAgo(ts){ var d=Math.floor((Date.now()-ts)/86400000); return d<=0?"today":(d+"d ago"); }
function profileCompleteness(p){
  var fields = [p.firstName,p.lastName,p.email,p.phone,p.country,p.city,p.school,p.gradYear,p.gpa,p.ielts,p.statement];
  var filled = fields.filter(function(v){ return v && String(v).trim().length>0; }).length;
  var docs = p.documents || {};
  var docFilled = ["passport","transcript","recommendation","photo"].filter(function(k){ return docs[k]; }).length;
  var activityScore = (p.activities||[]).length>0 ? 1 : 0;
  var recScore = (p.recommenders||[]).length>0 ? 1 : 0;
  var total = fields.length + 4 + 2;
  return Math.round(((filled+docFilled+activityScore+recScore)/total)*100);
}
/* Common-App-style per-college checklist: shared profile pieces + this school's own supplement. */
function checklistFor(app, uni){
  var p = state.profile;
  var docs = p.documents || {};
  var items = [
    {label:"Common Profile", done: !!(p.firstName && p.lastName && p.email && p.gpa)},
    {label:"Activities", done: (p.activities||[]).length>0},
    {label:"Test scores", done: !!(p.ielts && parseFloat(p.ielts)>0)},
    {label:"Documents", done: !!(docs.passport && docs.transcript) },
    {label:"Personal essay", done: !!(p.statement && p.statement.trim().length>40)},
    {label:"Recommender invited", done: (p.recommenders||[]).length>0},
    {label:uni.name.length>22 ? "School supplement" : uni.name+" supplement", done: !!(app && app.supplementAnswer && app.supplementAnswer.trim().length>20)}
  ];
  var doneCount = items.filter(function(i){ return i.done; }).length;
  return {items:items, doneCount:doneCount, total:items.length, pct:Math.round(doneCount/items.length*100)};
}

function computeTodos(){

  var pf = state.profile;
  var pct = profileCompleteness(pf);
  if(pct < 100) todos.push({label:"Finish your profile", sub:(100-pct)+"% left to go", href:"profile"});
  state.apps.forEach(function(a){
    if(a.status==="admitted" || a.status==="declined" || a.status==="waitlisted") return;
    var u = uniById(a.uniId); if(!u) return;
    var cl = checklistFor(a, u);
    cl.items.forEach(function(it){
      if(!it.done) todos.push({label:it.label+" — "+u.name, sub:"Deadline "+u.deadline.split(",")[0], href:"profile"});

  });
  return todos.slice(0,4);
}

/* ===================== RENDER: COMPARE ===================== */
function renderCompare(){
  var picked = state.compare.map(uniById).filter(Boolean);
  var rows = [
    ["Country", function(u){ return u.country; }],
    ["World rank", function(u){ return u.rank; }],
    ["Selectivity", function(u){ return u.selectivity; }],
    ["Tuition / yr", function(u){ return fmtUSD(u.tuitionUSD); }],
    ["Scholarship route", function(u){ return u.scholarship ? "Yes" : "Limited"; }],
    ["IELTS min", function(u){ return u.ielts.toFixed(1); }],
    ["TOEFL min", function(u){ return u.toefl; }],
    ["Degree length", function(u){ return u.duration; }],
    ["Deadline", function(u){ return u.deadline; }],
    ["Language", function(u){ return u.language; }]
  ];

  var slots = "";
  for(var i=0;i<3;i++){
    if(picked[i]){
      slots += '<div class="card" style="padding:12px 14px;flex:1;min-width:160px;display:flex;justify-content:space-between;align-items:center;gap:8px">' +
        '<span style="font-weight:700;font-size:13.5px">'+esc(picked[i].name)+'</span>' +
        '<button class="btn btn-ghost btn-sm" data-uncompare="'+picked[i].id+'">Remove</button></div>';
    } else {
      slots += '<div class="cmp-slot">Pick a university from the shortlist below</div>';
    }
  }

  var shortlistUnis = state.shortlist.map(uniById).filter(Boolean);

  var table = "";
  if(picked.length){
    table = '<div class="card cmp-scroll" style="padding:4px 18px"><table class="cmp-table"><thead><tr><th>Criteria</th>' +
      picked.map(function(u){ return '<th>'+esc(u.name)+'</th>'; }).join("") + '</tr></thead><tbody>' +
      rows.map(function(r){ return '<tr><td class="k">'+r[0]+'</td>' + picked.map(function(u){ return '<td class="mono-cell">'+esc(r[1](u))+'</td>'; }).join("") + '</tr>'; }).join("") +
      '</tbody></table></div>';
  } else {
    table = '<div class="card empty">Pick up to 3 universities to compare side by side.</div>';
  }

  return '<section class="section" style="padding-top:28px">' +
    '<div class="section-head"><div><div class="eyebrow">Compare</div><h2 style="margin:4px 0 0;font-size:26px">Up to 3 universities, side by side</h2></div></div>' +
    '<div class="cmp-pick">'+slots+'</div>' +
    table +
    '<div class="divider"></div>' +
    '<h3 style="font-size:15px;margin-bottom:10px">Your shortlist</h3>' +
    (shortlistUnis.length ?
      '<div class="chip-row">' + shortlistUnis.map(function(u){
        var on = state.compare.indexOf(u.id)>-1;
        return '<button class="chip'+(on?' on':'')+'" data-compare-toggle="'+u.id+'">'+esc(u.name)+'</button>';
      }).join("") + '</div>'
      : '<p class="hint">Star universities on the Explore page to add them here.</p>') +
  '</section>';
}

/* ===================== RENDER: APPLICATIONS ===================== */
function renderApplications(){
  var apps = state.apps.slice().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  var counts = {draft:0,submitted:0,review:0,decided:0};
  apps.forEach(function(a){
    if(a.status==="draft") counts.draft++;
    else if(a.status==="submitted") counts.submitted++;
    else if(a.status==="review") counts.review++;
    else counts.decided++;
  });

  return '<section class="section" style="padding-top:28px">' +
    '<div class="eyebrow">My Colleges</div><h2 style="margin:4px 0 18px;font-size:26px">Every school, one list</h2>' +
    '<div class="dash-stats">' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--muted)">'+counts.draft+'</div><div class="hint">Draft</div></div>' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--info)">'+counts.submitted+'</div><div class="hint">Submitted</div></div>' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--warn)">'+counts.review+'</div><div class="hint">Under review</div></div>' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--good)">'+counts.decided+'</div><div class="hint">Decided</div></div>' +
    '</div>' +
    (apps.length ? apps.map(appStubHtml).join("") : '<div class="card empty">No colleges yet. Explore universities and hit "Start application".</div>') +
    '<button class="btn btn-ghost" data-go="explore">+ Add another college</button>' +
  '</section>';
}

function appStubHtml(a){
  var u = uniById(a.uniId);
  if(!u) return "";
  var meta = STATUS_META[a.status];
  var cl = checklistFor(a, u);
  var decided = a.status==="admitted" || a.status==="declined" || a.status==="waitlisted";
  var segs = [0,1,2,3].map(function(i){ return '<div class="tl-seg'+(i<=meta.step?' on':'')+'"></div>'; }).join("");

  var statusOptions = ["draft","submitted","review","admitted","waitlisted","declined"].map(function(k){
    return '<option value="'+k+'"'+(a.status===k?' selected':'')+'>'+STATUS_META[k].label+'</option>';
  }).join("");

  return '<div class="card stub">' +
    '<div class="stub-main">' +
      '<div class="stub-title"><div><div class="stub-name">'+esc(u.name)+'</div><div class="hint">'+esc(u.city+", "+u.country)+' · '+esc(a.program)+'</div></div>' + pillHtml(meta.label, meta.color) + '</div>' +
      '<div class="timeline">'+segs+'</div>' +
      '<div class="tl-labels">'+STEP_LABELS.map(function(l){return '<span>'+l+'</span>';}).join("")+'</div>' +
      (decided ? '' :
        '<div class="bar-track" style="margin-top:12px"><div class="bar-fill" style="width:'+cl.pct+'%"></div></div>' +
        '<div class="checklist-mini">' + cl.items.map(function(it){
          return '<span class="ck-chip'+(it.done?' on':'')+'">'+(it.done?"✓":"○")+' '+esc(it.label)+'</span>';
        }).join("") + '</div>' +
        ((state.profile.plan||"free")==="free" ?
          '<div class="locked-row">🔒 Advisor review of your supplement <button class="btn btn-ghost btn-sm" data-go="pricing">Plus feature</button></div>' :
          '<div class="locked-row" style="border-style:solid;color:var(--ink)">Advisor review' +
            (a.reviewRequested ? pillHtml("Requested","info") : '<button class="btn btn-ghost btn-sm" data-request-review="'+a.id+'">Request review</button>') +
          '</div>')
      ) +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px">' +
        '<span class="hint">Last update '+daysAgo(a.updatedAt)+'</span>' +
        '<button class="btn btn-ghost btn-sm" data-go="uni-'+a.uniId+'">View school</button>' +
      '</div>' +
      '<div class="demo-control"><label for="statusSel_'+a.id+'">For this walkthrough — jump to stage:</label>' +
        '<select id="statusSel_'+a.id+'" data-status-select="'+a.id+'">'+statusOptions+'</select>' +
      '</div>' +
    '</div>' +
    '<div class="stub-side"><span class="stamp">'+esc(u.cc)+'</span>' + pillHtml(meta.label, meta.color) + '<span class="hint" style="font-size:11px">'+cl.doneCount+'/'+cl.total+' complete</span></div>' +
  '</div>';
}

/* ===================== RENDER: APPLY FLOW ===================== */
function renderApply(id){
  var u = uniById(id);
  if(!u) return '<section class="section"><p>University not found.</p></section>';
  var existing = state.apps.find(function(a){ return a.uniId===id; });
  if(existing){
    return '<section class="section" style="padding-top:28px">' +
      '<div class="card" style="padding:26px;text-align:center">' +
        '<h2 style="margin:0 0 8px">You already started this one</h2>' +
        '<p class="hint" style="margin:0 0 16px">'+esc(u.name)+' is already in your applications dashboard.</p>' +
        '<button class="btn btn-primary" data-go="applications">Go to dashboard</button>' +
      '</div></section>';
  }

  if((state.profile.plan||"free")==="free" && state.apps.length >= FREE_APP_LIMIT){
    return '<section class="section" style="padding-top:28px;max-width:560px;margin:0 auto">' +
      '<div class="card gate-card">' +
        '<h3>Free plan covers '+FREE_APP_LIMIT+' applications</h3>' +
        '<p>You\'re already tracking '+state.apps.length+'. Upgrade to Plus for unlimited applications, or finish one of your current colleges first.</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
          '<button class="btn btn-primary" data-go="pricing">See plans</button>' +
          '<button class="btn btn-ghost" data-go="uni-'+u.id+'">Back to '+esc(u.name)+'</button>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  var p = state.profile;
  var steps = ["Profile & program","Checklist","Essay","School question","Review & submit"];
  var s = state.applyStep;
  var lastStep = steps.length - 1;

  var stepperHtml = '<div class="step-label"><span>Step '+(s+1)+' of '+steps.length+'</span><span>'+steps[s]+'</span></div>' +
    '<div class="stepper">' + steps.map(function(_,i){ return '<div class="seg'+(i<s?' done':i===s?' cur':'')+'"></div>'; }).join("") + '</div>';

  var body = "";
  if(s===0){
    body = '<div class="kv">' +
      '<div class="kv-item"><div class="l">Applicant</div><div class="v" style="font-size:14px">'+esc(p.firstName+" "+p.lastName)+'</div></div>' +
      '<div class="kv-item"><div class="l">IELTS on file</div><div class="v">'+esc(p.ielts||"—")+' (needs '+u.ielts.toFixed(1)+')</div></div>' +
    '</div>' +
    '<div class="field" style="margin-top:16px"><label for="applyProgram">Program</label>' +
      '<select id="applyProgram">' + u.programs.map(function(pr){ return '<option>'+esc(pr)+'</option>'; }).join("") + '</select>' +
    '</div>' +
    (parseFloat(p.ielts||0) < u.ielts ? '<p class="hint" style="color:var(--warn);margin-top:10px">Your IELTS on file is below this school\'s usual minimum — flag it for your advisor before submitting.</p>' : '');
  } else if(s===1){
    var docs = [["passport","Passport scan"],["transcript","Academic transcript"],["recommendation","Recommendation letter"],["photo","ID photo"]];
    body = docs.map(function(d){
      var ok = p.documents && p.documents[d[0]];
      return '<div class="check-row"><div class="check-mark '+(ok?'ok':'bad')+'">'+(ok?"✓":"!")+'</div><div><div style="font-weight:600;font-size:13.5px">'+d[1]+'</div><div class="hint">'+(ok?"On file from your profile":"Missing — add it on your Profile page")+'</div></div></div>';
    }).join("") +
    '<div class="check-row"><div class="check-mark '+((p.activities||[]).length>0?'ok':'bad')+'">'+((p.activities||[]).length>0?"✓":"!")+'</div><div><div style="font-weight:600;font-size:13.5px">Activities list</div><div class="hint">'+((p.activities||[]).length>0 ? (p.activities||[]).length+" activities on file" : "Add at least one on your Profile page")+'</div></div></div>' +
    '<div class="check-row"><div class="check-mark '+((p.recommenders||[]).length>0?'ok':'bad')+'">'+((p.recommenders||[]).length>0?"✓":"!")+'</div><div><div style="font-weight:600;font-size:13.5px">Recommender invited</div><div class="hint">'+((p.recommenders||[]).length>0 ? "Invited from your profile" : "Invite one on your Profile page")+'</div></div></div>' +
    '<p class="hint" style="margin-top:12px">Missing something? <a href="#profile">Jump to your profile</a> and come back — your progress here is kept.</p>';
  } else if(s===2){
    body = '<p class="hint" style="margin-bottom:10px">Starting from your saved personal statement. Tighten it for '+esc(u.name)+' specifically.</p>' +
      '<div class="field"><textarea id="applyEssay" rows="7">'+esc(p.statement)+'</textarea></div>';
  } else if(s===3){
    body = '<div class="fact-box" style="margin-top:0"><span class="fact-k">'+esc(u.name)+' asks</span>'+esc(u.supplementPrompt)+'</div>' +
      '<div class="field" style="margin-top:14px"><label for="applySupplement">Your answer (~'+u.supplementWords+' words)</label><textarea id="applySupplement" rows="6">'+esc(state.applySupplement||"")+'</textarea></div>' +
      '<p class="hint" style="margin-top:8px">This one is school-specific — it won\'t be reused anywhere else, unlike your shared personal statement.</p>';
  } else {
    var reviewProgram = document.getElementById("applyProgram") ? document.getElementById("applyProgram").value : u.programs[0];
    var reviewSup = state.applySupplement || "";
    body = '<div class="kv">' +
      '<div class="kv-item"><div class="l">University</div><div class="v" style="font-size:14px">'+esc(u.name)+'</div></div>' +
      '<div class="kv-item"><div class="l">Program</div><div class="v" style="font-size:14px">'+esc(reviewProgram)+'</div></div>' +
      '<div class="kv-item"><div class="l">Deadline</div><div class="v" style="font-size:14px">'+esc(u.deadline)+'</div></div>' +
      '<div class="kv-item"><div class="l">Application fee</div><div class="v" style="font-size:14px">'+esc(u.appFee)+'</div></div>' +
    '</div>' +
    '<div class="divider"></div>' +
    '<h4 style="margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">What gets submitted</h4>' +
    '<div class="check-row"><div class="check-mark ok">✓</div><div><div style="font-weight:600;font-size:13.5px">'+esc(p.firstName+" "+p.lastName)+'</div><div class="hint">IELTS '+esc(p.ielts||"—")+' · GPA '+esc(p.gpa||"—")+'/'+esc(p.gpaScale||"4.0")+'</div></div></div>' +
    '<div class="check-row"><div class="check-mark ok">✓</div><div><div style="font-weight:600;font-size:13.5px">'+(p.activities||[]).length+' activities</div><div class="hint">Reused from your profile</div></div></div>' +
    '<div class="check-row"><div class="check-mark ok">✓</div><div><div style="font-weight:600;font-size:13.5px">Personal statement</div><div class="hint">'+esc((p.statement||"").slice(0,70))+(p.statement && p.statement.length>70 ? "…" : "")+'</div></div></div>' +
    '<div class="check-row"><div class="check-mark ok">✓</div><div><div style="font-weight:600;font-size:13.5px">School supplement</div><div class="hint">'+esc(reviewSup.slice(0,70))+(reviewSup.length>70?"…":"")+'</div></div></div>' +
    '<a class="official-link" href="https://'+esc(u.applyUrl)+'" target="_blank" rel="noopener">Cross-check on the official site ↗<span>'+esc(u.applyUrl)+'</span></a>' +
    '<p class="hint" style="margin-top:14px">Submitting creates a tracked application on your My Colleges page with a full draft → submitted → under review → decision timeline. There\'s no backend yet, so nothing is actually sent to the university — use the official site link above for the real submission.</p>';
  }

  return '<section class="section" style="padding-top:28px;max-width:640px;margin:0 auto">' +
    '<button class="btn btn-ghost btn-sm" data-go="uni-'+u.id+'" style="margin-bottom:16px">&larr; Cancel</button>' +
    '<div class="eyebrow">'+stampHtml(u)+'</div>' +
    '<h2 style="margin:6px 0 20px;font-size:24px">Apply to '+esc(u.name)+'</h2>' +
    stepperHtml +
    '<div class="card" style="padding:22px;margin-top:18px">' + body + '</div>' +
    '<div style="display:flex;justify-content:space-between;margin-top:18px">' +
      (s>0 ? '<button class="btn btn-ghost" id="applyBack">Back</button>' : '<span></span>') +
      (s<lastStep ? '<button class="btn btn-primary" id="applyNext">Continue</button>' : '<button class="btn btn-primary" id="applySubmit">Submit application</button>') +
    '</div>' +
  '</section>';
}

/* ===================== RENDER: PRICING ===================== */

/* ===================== RENDER: DASHBOARD ===================== */
function computeActivityFeed(){
  var events = [];
  state.apps.forEach(function(a){
    var u = uniById(a.uniId); if(!u) return;
    (a.history||[]).forEach(function(h){
      events.push({label:h[0]+" — "+u.name, ts:h[1]});
    });
  });
  (state.profile.recommenders||[]).forEach(function(r){
    if(r.status==="submitted") events.push({label:r.name+"'s letter came in", ts:Date.now()-2*86400000});
  });
  events.sort(function(x,y){ return y.ts - x.ts; });
  return events.slice(0,6);
}

function renderDashboard(){
  var apps = state.apps.slice().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  var pct = profileCompleteness(state.profile);
  var decided = apps.filter(function(a){ return a.status==="admitted"||a.status==="declined"||a.status==="waitlisted"; }).length;
  var active = apps.length - decided;
  var feed = computeActivityFeed();
  var todos = computeTodos();
  var deadlineRows = apps.filter(function(a){ return a.status!=="admitted" && a.status!=="declined" && a.status!=="waitlisted"; })
    .map(function(a){ var u = uniById(a.uniId); return u ? {u:u, a:a} : null; }).filter(Boolean);

  var plan = state.profile.plan || "free";

  return '<section class="section" style="padding-top:28px">' +
    '<div class="eyebrow">Dashboard</div><h2 style="margin:4px 0 4px;font-size:26px">'+greeting()+', '+esc(state.profile.firstName||"there")+'</h2>' +
    '<p class="hint" style="margin:0 0 20px">Your home base — profile status, every deadline, and what moved recently.</p>' +

    (plan==="free" ?
      '<div class="card" style="padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--accent)">' +
        '<div><b style="font-size:13.5px">'+apps.length+' of '+FREE_APP_LIMIT+' free applications used</b><div class="hint">Plus removes the cap and adds advisor review.</div></div>' +
        '<button class="btn btn-primary btn-sm" data-go="pricing">See plans</button>' +
      '</div>'
    : '') +

    '<div class="dash-stats">' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--accent)">'+pct+'%</div><div class="hint">Profile complete</div></div>' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--ink)">'+apps.length+'</div><div class="hint">Total colleges</div></div>' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--info)">'+active+'</div><div class="hint">Active applications</div></div>' +
      '<div class="card" style="padding:16px"><div class="n mono" style="font-size:24px;color:var(--good)">'+decided+'</div><div class="hint">Decisions in</div></div>' +
    '</div>' +

    '<div class="dash-grid">' +
      '<div class="card" style="padding:20px">' +
        '<h3 style="margin:0 0 12px;font-size:15px">Deadlines at a glance</h3>' +
        (deadlineRows.length ? deadlineRows.map(function(r){
          return '<div class="deadline-row"><div><div style="font-weight:700;font-size:13.5px">'+esc(r.u.name)+'</div><div class="hint">'+esc(r.u.deadline)+'</div></div>' + pillHtml(STATUS_META[r.a.status].label, STATUS_META[r.a.status].color) + '</div>';
        }).join("") : '<p class="hint">No active applications yet — add a college from Explore.</p>') +
      '</div>' +

      '<div class="card" style="padding:20px">' +
        '<h3 style="margin:0 0 12px;font-size:15px">Recent activity</h3>' +
        (feed.length ? '<ul class="feed-list">' + feed.map(function(e){
          return '<li><span>'+esc(e.label)+'</span><span class="hint">'+daysAgo(e.ts)+'</span></li>';
        }).join("") + '</ul>' : '<p class="hint">Nothing yet — submit your first application to see it here.</p>') +
      '</div>' +
    '</div>' +

    '<div class="card" style="padding:20px;margin-top:16px">' +
      '<h3 style="margin:0 0 12px;font-size:15px">Outstanding tasks</h3>' +
      (todos.length ? '<ul class="todo-list">' + todos.map(function(t){
        return '<li><button data-go="'+t.href+'"><span>'+esc(t.label)+'</span><span class="hint">'+esc(t.sub)+'</span></button></li>';
      }).join("") + '</ul>' : '<p class="hint">You\'re caught up.</p>') +
    '</div>' +

    '<div class="quick-links">' +
      '<button class="card quick-link" data-go="explore"><b>Explore</b><span class="hint">Browse all '+UNIS.length+' universities</span></button>' +
      '<button class="card quick-link" data-go="profile"><b>My Profile</b><span class="hint">Activities, essay, documents</span></button>' +
      '<button class="card quick-link" data-go="applications"><b>My Colleges</b><span class="hint">Track every application</span></button>' +
      '<button class="card quick-link" data-go="resources"><b>Resources</b><span class="hint">Guides for this process</span></button>' +
    '</div>' +
  '</section>';
}

/* ===================== MAIN RENDER ===================== */
var lastRouteKey = null;
function render(){
  var route = parseHash();
  var app = document.getElementById("app");

  if(route.view!=="apply"){ state.applyStep = 0; state.applySupplement = ""; }

  var html = "";
  if(route.view==="home") html = renderHome();
  else if(route.view==="dashboard") html = renderDashboard();
  else if(route.view==="explore") html = renderExplore();
  else if(route.view==="uni") html = renderUniDetail(route.id);
  else if(route.view==="compare") html = renderCompare();
  else if(route.view==="profile") html = renderProfile();
  else if(route.view==="applications") html = renderApplications();
  else if(route.view==="apply") html = renderApply(route.id);
  else if(route.view==="resources") html = renderResources();
  else if(route.view==="pricing") html = renderPricing();
  else html = renderHome();

  app.innerHTML = html;
  var routeKey = route.view + (route.id||"") + (route.view==="apply" ? ":"+state.applyStep : "");
  if(routeKey !== lastRouteKey) window.scrollTo(0,0);
  lastRouteKey = routeKey;

  document.querySelectorAll(".sidebar-nav button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-go")===route.view || (route.view==="uni" && b.getAttribute("data-go")==="explore"));
  });
  var pct = profileCompleteness(state.profile);
  var pf = state.profile;
  var initials = ((pf.firstName||"?")[0] + (pf.lastName||"?")[0]).toUpperCase();
  document.getElementById("sidebarAvatar").textContent = initials;
  document.getElementById("sidebarUserName").textContent = (pf.firstName||"Your") + " " + (pf.lastName||"profile");
  document.getElementById("sidebarUserSub").textContent = pct===100 ? "Profile complete" : pct+"% of profile done";
  document.getElementById("appsCount").textContent = state.apps.length;
  var planEl = document.getElementById("planBadge");
  planEl.textContent = planName(pf.plan);
  planEl.classList.toggle("paid", pf.plan!=="free");
  document.getElementById("pricingNavBtn").textContent = pf.plan==="free" ? "Upgrade" : "My Plan";

  bindViewEvents(route);
}

/* ===================== EVENT BINDING ===================== */
function bindViewEvents(route){
  document.querySelectorAll("[data-star]").forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      var id = b.getAttribute("data-star");
      var idx = state.shortlist.indexOf(id);
      if(idx>-1) state.shortlist.splice(idx,1); else state.shortlist.push(id);
      saveShortlist();
      render();
    });
  });

  document.querySelectorAll(".copybtn").forEach(function(b){
    b.addEventListener("click", function(){
      var text = b.getAttribute("data-copy");
      function done(){ toast("Copied " + text); }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(done);
      } else { done(); }
    });
  });

  var bookBtn = document.getElementById("bookCallBtn");
  if(bookBtn) bookBtn.addEventListener("click", function(){ toast("Not wired up yet — connect this to your real booking link"); });

  document.querySelectorAll("[data-switch-plan]").forEach(function(b){
    b.addEventListener("click", function(){
      var planId = b.getAttribute("data-switch-plan");
      state.profile.plan = planId;
      saveProfile();
      toast("Switched to " + planName(planId) + " — billing isn't wired up yet, this just simulates the plan");
      render();
    });
  });

  if(route.view==="explore"){
    var fq = document.getElementById("fq");
    if(fq) fq.addEventListener("input", function(){ state.filters.q = fq.value; render(); setTimeout(function(){ var el=document.getElementById("fq"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },0); });
    var fsel = document.getElementById("fsel");
    if(fsel) fsel.addEventListener("change", function(){ state.filters.selectivity = fsel.value; render(); });
    var ftu = document.getElementById("ftu");
    if(ftu) ftu.addEventListener("input", function(){ state.filters.maxTuition = parseInt(ftu.value,10); render(); });
    var fsch = document.getElementById("fsch");
    if(fsch) fsch.addEventListener("change", function(){ state.filters.scholarshipOnly = fsch.checked; render(); });
    document.querySelectorAll(".country-chip").forEach(function(c){
      c.addEventListener("click", function(){
        var country = c.getAttribute("data-country");
        var idx = state.filters.countries.indexOf(country);
        if(idx>-1) state.filters.countries.splice(idx,1); else state.filters.countries.push(country);
        render();
      });
    });
  }

  if(route.view==="uni"){
    document.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click", function(){ detailTab = t.getAttribute("data-tab"); render(); });
    });
  }

  if(route.view==="compare"){
    document.querySelectorAll("[data-compare-toggle]").forEach(function(c){
      c.addEventListener("click", function(){
        var id = c.getAttribute("data-compare-toggle");
        var idx = state.compare.indexOf(id);
        if(idx>-1) state.compare.splice(idx,1);
        else if(state.compare.length<3) state.compare.push(id);
        else toast("Remove one to add another");
        render();
      });
    });
    document.querySelectorAll("[data-uncompare]").forEach(function(c){
      c.addEventListener("click", function(){
        var id = c.getAttribute("data-uncompare");
        state.compare = state.compare.filter(function(x){ return x!==id; });
        render();
      });
    });
  }

  if(route.view==="profile"){
    var form = document.getElementById("profileForm");
    document.querySelectorAll("[data-doc]").forEach(function(input){
      input.addEventListener("change", function(){
        var key = input.getAttribute("data-doc");
        var file = input.files && input.files[0];
        if(!file) return;
        state.profile.documents = state.profile.documents || {};
        state.profile.documents[key] = {name: file.name};
        saveProfile();
        render();
      });
    });
    if(form){
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var p = state.profile;
        ["firstName","lastName","email","phone","country","city","school","gradYear","gpa","gpaScale","ielts","sat"].forEach(function(id){
          var el = document.getElementById("f_"+id);
          if(el) p[id] = el.value;
        });
        var st = document.getElementById("f_statement");
        if(st) p.statement = st.value;
        saveProfile();
        render();
      });
    }

    var addActBtn = document.getElementById("addActivityBtn");
    if(addActBtn) addActBtn.addEventListener("click", function(){
      var role = document.getElementById("newActRole").value.trim();
      var org = document.getElementById("newActOrg").value.trim();
      if(!role || !org){ toast("Add a role and organization first"); return; }
      state.profile.activities = state.profile.activities || [];
      state.profile.activities.push({
        id: uid(),
        category: document.getElementById("newActCat").value,
        role: role, org: org,
        hours: document.getElementById("newActHours").value || "0",
        weeks: document.getElementById("newActWeeks").value || "0",
        description: document.getElementById("newActDesc").value.trim()
      });
      saveProfile();
      render();
    });
    document.querySelectorAll("[data-remove-activity]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-remove-activity");
        state.profile.activities = (state.profile.activities||[]).filter(function(a){ return a.id!==id; });
        saveProfile();
        render();
      });
    });

    var addRecBtn = document.getElementById("addRecommenderBtn");
    if(addRecBtn) addRecBtn.addEventListener("click", function(){
      var name = document.getElementById("newRecName").value.trim();
      var email = document.getElementById("newRecEmail").value.trim();
      if(!name || !email){ toast("Add a name and email first"); return; }
      state.profile.recommenders = state.profile.recommenders || [];
      state.profile.recommenders.push({
        id: uid(), name: name,
        role: document.getElementById("newRecRole").value.trim() || "Recommender",
        email: email, status:"invited"
      });
      saveProfile();
      toast("Invite saved for " + name + " — email sending isn't wired up yet");
      render();
    });
    document.querySelectorAll("[data-mark-recommender]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-mark-recommender");
        var r = (state.profile.recommenders||[]).find(function(x){ return x.id===id; });
        if(r){ r.status = "submitted"; saveProfile(); render(); }
      });
    });
    document.querySelectorAll("[data-remove-recommender]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-remove-recommender");
        state.profile.recommenders = (state.profile.recommenders||[]).filter(function(r){ return r.id!==id; });
        saveProfile();
        render();
      });
    });
  }

  if(route.view==="applications"){
    document.querySelectorAll("[data-status-select]").forEach(function(sel){
      sel.addEventListener("change", function(){
        var id = sel.getAttribute("data-status-select");
        var app = state.apps.find(function(a){ return a.id===id; });
        if(!app) return;
        app.status = sel.value;
        app.updatedAt = Date.now();
        app.history.push([STATUS_META[app.status].label, app.updatedAt]);
        saveApps();
        toast(uniById(app.uniId).name + " → " + STATUS_META[app.status].label);
        render();
      });
    });
    document.querySelectorAll("[data-request-review]").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-request-review");
        var app = state.apps.find(function(a){ return a.id===id; });
        if(!app) return;
        app.reviewRequested = true;
        saveApps();
        toast("Review requested — your advisor will follow up (not wired up yet)");
        render();
      });
    });
  }

  if(route.view==="apply"){
    var nextBtn = document.getElementById("applyNext");
    var backBtn = document.getElementById("applyBack");
    var submitBtn = document.getElementById("applySubmit");
    if(nextBtn) nextBtn.addEventListener("click", function(){
      if(state.applyStep===2){
        var essay = document.getElementById("applyEssay");
        if(essay) state.profile.statement = essay.value;
        saveProfile();
      }
      if(state.applyStep===3){
        var sup = document.getElementById("applySupplement");
        if(sup) state.applySupplement = sup.value;
      }
      state.applyStep++; render();
    });
    if(backBtn) backBtn.addEventListener("click", function(){
      if(state.applyStep===3){
        var sup2 = document.getElementById("applySupplement");
        if(sup2) state.applySupplement = sup2.value;
      }
      state.applyStep--; render();
    });
    if(submitBtn) submitBtn.addEventListener("click", function(){
      var u = uniById(route.id);
      var programEl = document.getElementById("applyProgram");
      var now = Date.now();
      var app = {id:uid(), uniId:u.id, status:"submitted", program: programEl?programEl.value:u.programs[0], createdAt:now, updatedAt:now,
        supplementAnswer: state.applySupplement || "",
        history:[["Draft",now-1000],["Submitted",now]]};
      state.apps.push(app);
      saveApps();
      state.applySupplement = "";
      toast("Application to " + u.name + " submitted");
      go("applications");
    });
  }
}

render();
})();
</script>
